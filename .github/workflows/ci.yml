name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build container
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .dockerfile
          push: false
          load: true
          tags: |
            team4-frontend:${{ github.sha }}
            team4-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image was tagged
        env:
          SHA: ${{ github.sha }}
        run: |
          docker image inspect "team4-frontend:${SHA}" --format 'built {{.Id}} ({{.Size}} bytes)'
          docker image ls team4-frontend
